# Так чтобы заработало на серваке создать папку, туда docker-compose.yml с .env, Caddyfile и мб еще чтото
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
  caddy:
    image: caddy:2-alpine
    container_name: auc-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - caddy_net
      - default
  go:
    image: ghcr.io/artemchadaev/auc-go:v0.1
    environment:
      - DEPLOY=true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - default
  react:
    image: ghcr.io/artemchadaev/auc-react:v0.1
    networks:
      - default

networks:
  caddy_net:
    external: true