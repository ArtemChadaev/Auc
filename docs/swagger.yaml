definitions:
  documents.Document:
    properties:
      id:
        type: integer
      is_major:
        type: boolean
      name:
        type: string
      published_at:
        type: string
      superseded_at:
        type: string
      text:
        type: string
      version:
        type: string
    type: object
  documents.UserConsent:
    properties:
      created_at:
        type: string
      document_id:
        type: integer
      user_id:
        type: string
    type: object
  documents.consentReq:
    properties:
      document_id:
        type: integer
    type: object
  httpx.Response:
    properties:
      data: {}
      error:
        type: string
    type: object
  item.Item:
    properties:
      created_at:
        type: string
      creator_id:
        type: string
      id:
        type: integer
      metadata:
        type: object
      owner_id:
        type: string
      type:
        $ref: '#/definitions/mimeType.ItemType'
    type: object
  item.confirmUploadReq:
    properties:
      key:
        type: string
    type: object
  item.confirmUploadResp:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  item.downloadURLResp:
    properties:
      url:
        type: string
    type: object
  item.giftItemReq:
    properties:
      description:
        type: string
      item_id:
        type: integer
      new_owner:
        type: string
    type: object
  item.uploadURLReq:
    properties:
      file_size:
        type: integer
      filename:
        type: string
      sha_256_hex:
        type: string
    type: object
  item.uploadURLResp:
    properties:
      key:
        type: string
      url:
        type: string
    type: object
  lot.Bid:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      lot_id:
        type: integer
      user_id:
        type: string
    type: object
  lot.Description:
    properties:
      auto_activate:
        type: boolean
      photo:
        items:
          type: string
        type: array
      short_text:
        type: string
      tags:
        items:
          type: string
        type: array
      text:
        type: string
      type:
        $ref: '#/definitions/mimeType.ItemType'
    type: object
  lot.Lot:
    properties:
      created_at:
        type: string
      description:
        $ref: '#/definitions/lot.Description'
      ends_at:
        type: string
      finish_amount:
        type: integer
      finished_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      min_step:
        type: integer
      seller_id:
        type: string
      start_amount:
        type: integer
      started_at:
        type: string
      status:
        type: string
      title:
        type: string
      winner_id:
        type: string
    type: object
  lot.activateReq:
    properties:
      ends_at:
        type: string
      started_at:
        type: string
    type: object
  lot.reqBid:
    properties:
      amount:
        type: integer
      idempotency_key:
        type: string
    type: object
  lot.reqNewLot:
    properties:
      description:
        $ref: '#/definitions/lot.Description'
      ends_at:
        type: string
      item_id:
        type: integer
      min_step:
        type: integer
      start_amount:
        type: integer
      started_at:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  mimeType.ItemType:
    enum:
    - image
    - 3d
    - audio
    - video
    - document
    - archive
    type: string
    x-enum-varnames:
    - Image
    - Model3D
    - Audio
    - Video
    - Document
    - Archive
  user.Device:
    properties:
      browser:
        type: string
      os:
        type: string
    type: object
  user.Session:
    properties:
      created_at:
        type: string
      device:
        $ref: '#/definitions/user.Device'
      expires_at:
        type: string
      refresh_id:
        type: integer
      revoked_at:
        type: string
    type: object
  user.User:
    properties:
      avatar_id:
        type: string
      balance:
        type: integer
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      hold:
        type: integer
      id:
        type: string
      name:
        type: string
    type: object
  user.avatarResp:
    properties:
      image:
        type: string
    type: object
  user.findRefreshReq:
    properties:
      current:
        type: boolean
    type: object
  user.newNameReq:
    properties:
      name:
        type: string
    type: object
  user.refreshIdReq:
    properties:
      refresh_id:
        items:
          type: integer
        type: array
    type: object
  user.registerReq:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      uid:
        type: string
    type: object
  user.tokenResponds:
    properties:
      access_token:
        type: string
      refresh_session:
        $ref: '#/definitions/user.Session'
    type: object
  user.userReq:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
  description: REST API документация платформы аукциона Auction.
  title: Auction API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Аутентификация пользователя по email и паролю, возвращает access
        и refresh токены
      parameters:
      - description: Учетные данные пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.userReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.tokenResponds'
              type: object
        "401":
          description: Неверный email или пароль
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Авторизация пользователя
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Завершает указанные refresh-сессии пользователя. Требует авторизации
      parameters:
      - description: ID сессий для завершения
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.refreshIdReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - auth
  /api/auth/refresh:
    post:
      description: Обновляет access токен с использованием refresh_token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.tokenResponds'
              type: object
        "401":
          description: Отсутствует или невалидный cookie
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Сессия не найдена
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Обновление токенов
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Создает новый аккаунт пользователя и возвращает токены
      parameters:
      - description: Регистрационные данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.registerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.tokenResponds'
              type: object
        "409":
          description: Email уже занят
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/auth/session:
    post:
      consumes:
      - application/json
      description: Возвращает список сессий пользователя (текущих или всех). Требует
        авторизации
      parameters:
      - description: Фильтр сессий
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.findRefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/user.Session'
                  type: array
              type: object
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Сессии не найдены
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получение сессий пользователя
      tags:
      - auth
  /api/bid/{id}:
    post:
      consumes:
      - application/json
      description: Размещает новую ставку авторизованного пользователя на активный
        лот аукциона
      parameters:
      - description: ID лота
        in: path
        name: id
        required: true
        type: integer
      - description: Параметры ставки (сумма и ключ идемпотентности)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/lot.reqBid'
      produces:
      - application/json
      responses:
        "200":
          description: Ставка успешно принята
          schema:
            $ref: '#/definitions/httpx.Response'
        "400":
          description: Некорректная сумма ставки, меньший шаг или нехватка баланса
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "403":
          description: Продавец не может делать ставки на свой лот
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Лот не найден или не активен
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Разместить ставку на лот
      tags:
      - bid
  /api/bid/{id}/stream:
    get:
      description: Устанавливает Server-Sent Events соединение и отправляет список
        ставок каждые 2 секунды
      parameters:
      - description: ID лота
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: Поток ставок
          schema:
            items:
              $ref: '#/definitions/lot.Bid'
            type: array
        "400":
          description: Неверный ID лота
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: SSE поток ставок лота
      tags:
      - bid
  /api/document/:
    get:
      description: Возвращает список активных документов или один активный документ
        по query-параметру name
      parameters:
      - description: Название документа
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/documents.Document'
                  type: array
              type: object
        "404":
          description: Документ не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Получить список документов
      tags:
      - document
  /api/document/{id}:
    get:
      description: Возвращает документ по его числовому идентификатору
      parameters:
      - description: ID документа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/documents.Document'
              type: object
        "400":
          description: Неверный ID документа
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Документ не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Получить документ по ID
      tags:
      - document
  /api/document/consents:
    get:
      description: Возвращает все согласия с документами для текущего авторизованного
        пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/documents.UserConsent'
                  type: array
              type: object
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получить список согласий пользователя
      tags:
      - document
    post:
      consumes:
      - application/json
      description: Фиксирует согласие текущего пользователя с документом
      parameters:
      - description: ID документа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/documents.consentReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/documents.UserConsent'
              type: object
        "400":
          description: Неверный ID документа
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Документ не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Дать согласие с документом
      tags:
      - document
  /api/document/consents/{id}:
    get:
      description: Проверяет и возвращает согласие текущего пользователя с конкретным
        документом
      parameters:
      - description: ID документа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/documents.UserConsent'
              type: object
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Согласие не найдено
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получить согласие по ID документа
      tags:
      - document
  /api/document/name/{name}:
    get:
      description: Возвращает актуальную версию документа по его названию
      parameters:
      - description: Название документа
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/documents.Document'
              type: object
        "404":
          description: Документ не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Получить активный документ по названию
      tags:
      - document
  /api/item/{id}/download:
    get:
      description: Возвращает Presigned GET URL для скачивания файла владельцем (не
        более 1 раза в день)
      parameters:
      - description: ID предмета
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/item.downloadURLResp'
              type: object
        "400":
          description: Неверный ID предмета
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Предмет не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "429":
          description: Превышен суточный лимит скачиваний
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получить URL для скачивания предмета
      tags:
      - item
  /api/item/gift:
    post:
      consumes:
      - application/json
      description: Передает предмет новому владельцу с сохранением истории передачи
      parameters:
      - description: Параметры подарка
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/item.giftItemReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Предмет не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Передать предмет в подарок
      tags:
      - item
  /api/lot/:
    get:
      description: Возвращает список лотов аукциона со статусами active и finished
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/lot.Lot'
                  type: array
              type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Получить список лотов
      tags:
      - lot
    post:
      consumes:
      - application/json
      description: Создает лот на аукционе для принадлежащего пользователю предмета
        со статусом draft или pending_review
      parameters:
      - description: Параметры нового лота
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/lot.reqNewLot'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/lot.Lot'
              type: object
        "400":
          description: Некорректные параметры запроса
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Предмет не найден или не принадлежит пользователю
          schema:
            $ref: '#/definitions/httpx.Response'
        "409":
          description: Лот с данным предметом уже активен
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Создать новый лот
      tags:
      - lot
  /api/lot/{id}:
    delete:
      description: Отменяет лот продавца, если он еще не завершен и до старта больше
        часа
      parameters:
      - description: ID лота
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response'
        "400":
          description: Неверный ID лота
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Лот не найден, чужой или не может быть отменен
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Отменить лот
      tags:
      - lot
    get:
      description: Возвращает информацию о лоте по его числовому идентификатору
      parameters:
      - description: ID лота
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/lot.Lot'
              type: object
        "400":
          description: Неверный ID лота
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Лот не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Получить лот по ID
      tags:
      - lot
    put:
      consumes:
      - application/json
      description: Обновляет параметры лота продавцом по его ID (статус draft или
        pending_review)
      parameters:
      - description: ID лота
        in: path
        name: id
        required: true
        type: integer
      - description: Обновленные параметры лота
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/lot.reqNewLot'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/lot.Lot'
              type: object
        "400":
          description: Неверный ID или некорректные параметры
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Лот не найден или не принадлежит пользователю
          schema:
            $ref: '#/definitions/httpx.Response'
        "409":
          description: Конфликт уникальности предмета
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Обновить лот
      tags:
      - lot
  /api/lot/{id}/activate:
    post:
      consumes:
      - application/json
      description: Переводит лот продавца со статусом approved в статус active для
        старта торгов
      parameters:
      - description: ID лота
        in: path
        name: id
        required: true
        type: integer
      - description: Опциональные даты начала и окончания торгов
        in: body
        name: input
        schema:
          $ref: '#/definitions/lot.activateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/lot.Lot'
              type: object
        "400":
          description: Неверный ID лота или лот не в статусе approved
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Лот не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "409":
          description: Лот с данным предметом уже активен
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Активировать лот
      tags:
      - lot
  /api/lot/my:
    get:
      description: Возвращает все лоты, созданные текущим пользователем
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/lot.Lot'
                  type: array
              type: object
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получить мои лоты
      tags:
      - lot
  /api/upload/cancel:
    post:
      description: Отменяет активную загрузку пользователя, удаляет временный файл
        из S3 и освобождает слот
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "429":
          description: Превышен лимит отмен
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Отменить загрузку файла
      tags:
      - upload
  /api/upload/confirm:
    post:
      consumes:
      - application/json
      description: Подтверждает успешную загрузку файла в S3 для проверки и старта
        фонового парсинга. Ключ можно передать в заголовке X-Upload-Key или в теле
        JSON
      parameters:
      - description: UUID ключ загрузки
        in: header
        name: X-Upload-Key
        type: string
      - description: UUID ключ загрузки в теле
        in: body
        name: input
        schema:
          $ref: '#/definitions/item.confirmUploadReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/item.confirmUploadResp'
              type: object
        "400":
          description: Неверный или отсутствующий ключ загрузки / ошибка валидации
            файла
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Загрузка не найдена
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Подтвердить загрузку файла
      tags:
      - upload
  /api/upload/status:
    get:
      description: Проверяет текущий статус обработки файла по ключу загрузки
      parameters:
      - description: UUID ключ загрузки
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Файл в процессе обработки (pending, processing)
          schema:
            $ref: '#/definitions/httpx.Response'
        "201":
          description: Файл успешно обработан
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/item.Item'
              type: object
        "400":
          description: Неверный UUID ключа или несовпадение хеша
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Загрузка не найдена
          schema:
            $ref: '#/definitions/httpx.Response'
        "410":
          description: Загрузка отменена
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Ошибка обработки файла или внутренняя ошибка
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получить статус обработки файла
      tags:
      - upload
  /api/upload/url:
    post:
      consumes:
      - application/json
      description: Генерирует Presigned PUT URL для прямой загрузки файла в S3
      parameters:
      - description: Параметры загружаемого файла
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/item.uploadURLReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/item.uploadURLResp'
              type: object
        "400":
          description: Неверный размер, имя или SHA-256 хеш файла
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "409":
          description: Хеш уже существует или у пользователя уже есть активная загрузка
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/item.uploadURLResp'
              type: object
        "413":
          description: Превышен максимальный размер файла
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получить URL для загрузки файла
      tags:
      - upload
  /api/user/me:
    delete:
      description: Выполняет мягкое удаление профиля текущего пользователя
      produces:
      - application/json
      responses:
