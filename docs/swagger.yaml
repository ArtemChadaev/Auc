          description: OK
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Удалить профиль пользователя
      tags:
      - user
    get:
      description: Возвращает данные текущего авторизованного пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.User'
              type: object
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Получить профиль пользователя
      tags:
      - user
  /api/user/me/avatar:
    put:
      consumes:
      - multipart/form-data
      description: Загружает и устанавливает квадратный аватар пользователя
      parameters:
      - description: Файл изображения аватара (квадратный)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.avatarResp'
              type: object
        "400":
          description: Неверный формат или пропорции изображения
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/httpx.Response'
        "413":
          description: Превышен допустимый размер файла
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Обновить аватар пользователя
      tags:
      - user
  /api/user/name:
    patch:
      consumes:
      - application/json
      description: Изменяет отображаемое имя текущего пользователя
      parameters:
      - description: Новое имя пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.newNameReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/httpx.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/httpx.Response'
      security:
      - BearerAuth: []
      summary: Обновить имя пользователя
      tags:
      - user
securityDefinitions:
  BearerAuth:
    description: 'Введите токен авторизации в формате: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
